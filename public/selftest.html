<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>N-PAS 動作確認テスト</title>
<link rel="stylesheet" href="/css/admin.css">
<style>
.step{display:grid;grid-template-columns:28px 1fr auto;gap:8px;padding:9px 12px;border-bottom:1px solid #edf0f4;align-items:start}
.step:last-child{border:0}
.step .msg{font-size:12px;color:#5b6f84;font-weight:500;white-space:pre-wrap}
.step .ms{font-size:11px;color:#8b9aab;white-space:nowrap}
.big{font-size:18px;padding:14px 22px}
</style>
</head>
<body>
<header class="top"><div class="brand">N-PAS<small>動作確認テスト</small></div><div class="who"><a class="ghost button" href="/">スタッフ画面</a><a class="ghost button" href="/admin.html">管理画面</a></div></header>
<main class="wrap narrow" style="max-width:720px">
  <div class="card">
    <h2>ボタンを押すだけで、主な機能を自動で確認します</h2>
    <p class="note">テスト用のスタッフ（ID が TEST で始まる5人）だけを使います。本物のスタッフのデータには触れません。<br>本番環境ではこのテストは動きません（テスト環境・ローカル環境専用）。</p>
    <button type="button" class="primary big" id="run">▶ テストを実行</button>
    <p id="summary" class="note"></p>
  </div>
  <div class="card" style="padding:4px 0"><div id="steps"><p class="note" style="padding:0 16px">まだ実行していません。</p></div></div>
  <div class="card">
    <h3>手動で確認するときのテスト用アカウント</h3>
    <p class="note">スタッフ画面：学年「1年生」→「テスト 一郎」→ PIN <b>1234</b><br>管理画面：ログインID <b>testadmin</b> ／ パスワード <b>test-password-1234</b></p>
  </div>
</main>
<script type="module" src="/js/selftest.js"></script>
</body>
</html>
